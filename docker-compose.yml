services:
  app:
    container_name: lop-priority-app
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}:3000"
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - app-data:/app/data
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: "${NEXTAUTH_URL:?NEXTAUTH_URL must be set in .env}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}"
      DB_PATH: /app/data/users.db
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      ALLOW_PUBLIC_REGISTRATION: "${ALLOW_PUBLIC_REGISTRATION:-false}"
      DATA_SYNC_INTERVAL_SECONDS: "${DATA_SYNC_INTERVAL_SECONDS:-300}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:

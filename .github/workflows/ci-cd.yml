name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/rbac]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: docker build -t lop-priority:ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hafizsantosa/branch-focus-dashboard:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/HafizSantosa/branch-focus-dashboard

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare trusted SSH connection
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for name in VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS VPS_HOST VPS_USER IMAGE_DIGEST COMMIT_SHA; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub environment secret or variable: $name" >&2
              exit 1
            fi
          done
          port="${VPS_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]+$ ]] || (( port < 1 || port > 65535 )); then
            echo "VPS_PORT must be a TCP port number" >&2
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/ssh"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id" "$RUNNER_TEMP/ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ssh/id" -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- 'ghcr.io/hafizsantosa/branch-focus-dashboard@${IMAGE_DIGEST}' '${COMMIT_SHA}'" \
            < scripts/deploy-image.sh
